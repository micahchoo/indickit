# Every v* tag: run the CI checks again, then stage the package on npm.
# A maintainer approves the staged version on npmjs.com (2FA) before it goes
# live. No npm token: npm trusts this workflow file through OIDC
# (npmjs.com → indickit → Settings → Trusted publishing).
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag equals package.json version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      # A ^0.x.y range takes every patch, so a patch reaches users who did not
      # ask for it. It must give every input the same output and keep every
      # export: no rules, conformance file, table or type declaration may
      # differ from the previous tag. A change to any of those is a minor.
      - name: a patch changes no output and no API
        run: |
          v=${GITHUB_REF_NAME#v}
          patch=${v##*.}
          if [ "$patch" = 0 ]; then echo "minor release, no patch check"; exit 0; fi
          prev="v${v%.*}.$((patch - 1))"
          git rev-parse -q --verify "refs/tags/$prev" >/dev/null || { echo "$prev is not a tag"; exit 1; }
          git diff --stat --exit-code "$prev" HEAD -- '*/rules.json' '*/testdata/*' \
            romanize/lang deromanize/lang phonetic/scorer dist/types js/api.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: dist/ is current
        run: git diff --exit-code dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node js/check-dist.mjs
      # npm stage publish needs npm 11.15.0 or later.
      - run: npm install -g npm@latest
      - run: npm stage publish
