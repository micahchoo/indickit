# Every push and every tag: both implementations must agree with the
# conformance file on every word, and the committed dist/ must be the build
# of the committed source.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: dist/ is current
        run: git diff --exit-code dist/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node js/check-dist.mjs
